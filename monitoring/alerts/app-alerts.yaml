apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-application-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: devops-application-alerts
      rules:
        - alert: HighHTTPErrorRate
          expr: |
            (
              sum(rate(istio_requests_total{response_code=~"5.."}[5m]))
              /
              clamp_min(sum(rate(istio_requests_total[5m])), 0.001)
            ) * 100 > 5
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: High HTTP 5xx error rate
            description: More than 5% of application requests are returning HTTP 5xx errors.

        - alert: HighRequestLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(istio_request_duration_milliseconds_bucket[5m])
              )
            ) > 500
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: High application request latency
            description: The 95th percentile request latency is above 500 milliseconds.

        - alert: NoReadyApplicationPods
          expr: |
            sum(
              kube_pod_status_ready{
                namespace="gitops-demo",
                condition="true"
              }
            ) < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: No application pods are ready
            description: No ready pods were detected in the gitops-demo namespace.