{{- range $name, $config := dict "frontend" .Values.frontend "backend" .Values.backend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "microservices.fullname" $) $name | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      serviceAccountName: {{ include "microservices.serviceAccountName" $ }}
      containers:
        - name: {{ $name }}
          image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $config.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ $config.healthCheck.path }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ $config.healthCheck.path }}
              port: http
          securityContext:
            {{- toYaml $config.securityContext | nindent 12 }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
---
{{- end }}