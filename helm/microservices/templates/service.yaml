{{- range $name, $config := dict "frontend" .Values.frontend "backend" .Values.backend }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" (include "microservices.fullname" $) $name | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  type: {{ $config.service.type }}
  ports:
    - name: http
      port: {{ $config.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
---
{{- end }}