{{- if .Values.frontend.rollout.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "microservices.fullname" . }}-frontend
spec:
  hosts:
    - {{ include "microservices.fullname" . }}-frontend.{{ .Release.Namespace }}.svc.cluster.local
  http:
    - name: frontend
      route:
        - destination:
            host: {{ include "microservices.fullname" . }}-frontend.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.frontend.service.port }}
          weight: 100
        - destination:
            host: {{ include "microservices.fullname" . }}-frontend-canary.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.frontend.service.port }}
          weight: 0
{{- end }}
