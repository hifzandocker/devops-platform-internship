apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "microservices.fullname" . }}-test-connection"
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - >-
          wget -qO- http://{{ include "microservices.fullname" . }}-backend:{{ .Values.backend.service.port }}/health
  restartPolicy: Never