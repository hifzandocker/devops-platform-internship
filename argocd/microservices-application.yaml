apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hifzandocker/devops-platform-internship.git
    targetRevision: main
    path: helm/microservices
    helm:
      valueFiles:
        - values-gitops.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  ignoreDifferences:
    - group: ""
      kind: Service
      name: microservices-gitops-frontend
      namespace: gitops-demo
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
    - group: ""
      kind: Service
      name: microservices-gitops-frontend-canary
      namespace: gitops-demo
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
    - group: networking.istio.io
      kind: VirtualService
      name: microservices-gitops-frontend
      namespace: gitops-demo
      jqPathExpressions:
        - .spec.http[].route[].weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
