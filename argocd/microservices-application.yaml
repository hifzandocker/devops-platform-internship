apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hifzandocker/devops-platform-internship.git
    targetRevision: main
    path: helm/microservices
    helm:
      valueFiles:
        - values-gitops.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
